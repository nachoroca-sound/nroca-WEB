[build]
  publish = "."

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons: cache moderado y revalidable, nunca immutable — se retocan a mano.
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS/JS: revalidable mientras iteramos rápido — el nombre de fichero no cambia
# entre builds, así que un cache largo sirve versiones viejas contra HTML nuevo.
# TODO: pasar a nombre con hash (cache-busting) y volver a un cache largo/immutable.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

